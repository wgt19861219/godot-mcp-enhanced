name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [24]  # Node 22 在 Linux 未验证,保守单版本;engines>=20(package.json)声明不变(2026-09-20 可移植性 P2:原注释 >=18 与实际声明漂移,更正)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: "Typecheck test helpers (G-4: mock 工厂与真实接口编译期锚定)"
        # test/ 不在主 tsconfig include 内（vitest esbuild 只剥类型不检查）——
        # 单独 tsc 检查 test/helpers，否则 mock-results 的 satisfies 锚定无人消费=假接线
        run: npm run typecheck:helpers
      - run: npm run build
      - name: Check capability matrix drift (spec §10)
        # drift = 实时提取 vs committed docs/capability-matrix.json 不一致。
        # 改了工具契约（inputSchema/securityLevel/risk）须跑 npm run build-matrix 并 commit。
        run: node build/capability/diff-matrix.js
      - name: Check token budget (spec §E 体积预算)
        # warn-only 基线：error 阈值极高（当前 0 触发）。读 committed json 快照，
        # 不重算（drift step 已保证 json 是最新契约）。size 不进 diff-matrix drift。
        run: node scripts/check-token-budget.mjs
      - name: Check tool count consistency（报告④：README/manifest/规则文件 vs matrix 工具数）
        # 校验手写工具数/action 数与 capability-matrix.json 一致；漂移 exit 1。
        # 覆盖独立副本同步约束（rule-templates.ts vs .claude/rules/），补 check-rules-version-bump 的内容盲区。
        run: node scripts/check-tool-count.mjs
      - name: Check SSOT params（P8-3：handler args 键 ⊆ schema ∪ 白名单）
        # 双防线第二道：静态对账 handler 源码读取的顶层参数键与 inputSchema.properties。
        # 与运行时 unknown-param 拒绝（P8-2）互补——防 handler 读未声明键的 typo 黑洞。
        # 白名单 scripts/ssot-allowlist.json 需人工核对后提交（--fix 生成初稿）。
        # 读 committed matrix（drift step 已保证最新），对账 src/tools/ 源码。
        run: node scripts/check-ssot-params.mjs
      - name: Check e2e L2 coverage（架构检查 D1：gate 文件 ⊆ CI L2 列表机械对账）
        # p3/p8/p7 三连漏加白名单事故的机械防线：引用 GODOT_MCP_E2E_L2 gate 的测试文件
        # 必须在下方 E2E 步骤的 vitest 文件列表里（漏加 = CI 恒 skip = 无护栏）。
        # 新 L2 文件要么补进列表，要么文件头加 "e2e-l2-coverage: exempt(<原因>)" 豁免标记。
        run: node scripts/check-e2e-l2-coverage.mjs
      - name: Check tool groups invariant（CMP-12/13：module 注册 ↔ TOOL_GROUPS 归组一致性）
        # 校验 module-loader 注册的每个工具都在 TOOL_GROUPS 的 tools 或 ALWAYS_ALLOWED 里。
        # 防"module 注册了但 TOOL_GROUPS 漏加"→ isToolAllowed 恒 false → 工具发现层隐藏 + 执行层不可用。
        # 源于 CMP-4 第三方审查 B-1（engine/debug 第三次重蹈 D1 asset/android 覆辙）。读 build/ 产物，须在 build 后。
        run: npm run check:tool-groups
      - name: Check modules sync（CMP-13：import 块 ↔ ALL_MODULES 数组同步）
        # 校验 module-loader.ts 的 import 块与 ALL_MODULES 数组项数一致。
        # 防新增工具加 import 后忘记跑 npm run generate:modules（数组漏项 → 工具不注册）。
        run: npm run check:modules-sync
      - name: Check command docs drift（CMP-16-C：GD param docs ↔ TS inputSchema 一致性）
        # 校验 GD get_command_docs 声明的参数与 TS inputSchema 一致（防文档/代码漂移）。
        # 一期覆盖 debug + engine 工具组，其余标记一期豁免（映射表后续批次扩充）。
        run: npm run check:command-docs-drift
      - name: Check GD duplicates（2026-10-01 审查 §11：DUPLICATE 安全函数副本对账）
        # editor 插件(websocket_server.gd) ↔ bridge 运行时(mcp_bridge.gd)的 4 对安全
        # 敏感函数(_generate_secret/_constant_time_compare×2/_restrict_secret_permissions)
        # 归一化文本对账 + math 三副本 DUPLICATE 标记在场检查——此前无任何机械门禁,
        # 副本漂移(安全函数一侧被削弱)无 CI 报警。确定性对账,无环境依赖,阻断。
        run: npm run check:gd-duplicates
      - name: Check contract consistency（P1-6：跨工具契约一致性,参考 breakpoint contract_check）
        # 6 项校验:annotations 三 hint / danger-api+destructive 必 guarded / securityLevel-guarded 一致 /
        # offlineCapable-needsGodot 互斥 / description+inputSchema / riskDistribution 计数。
        run: node scripts/check-contract.mjs
      - name: Check rules version bump（spec §4 不变式）
        run: node scripts/check-rules-version-bump.mjs
      - name: Check version metadata consistency
        run: node scripts/version-sync.mjs --check
      - name: Check test quality (E-P2 :98)
        run: npm run check:test-quality
      - name: Check protocol versions (2026-08-07 批次4 P2：SDK vs GodotServer.ts 快照一致性)
        run: npm run check:protocol-versions
      - name: Check rules content sync (2026-08-16 原型翻译层遗留③：历史 drift 已清零，启用 STRICT 阻断)
        run: STRICT=1 npm run check:rules-sync
      - name: Check env isolation (2026-08-08 测试-P1-C：安全测试 env 隔离 footgun 守护，advisory)
        # 扫描 test/ 下直接赋值危险 env（绕过 vi.stubEnv）的 footgun。当前 62 条多为「保存 orig →
        # 设值 → afterEach 还原」正确模式，warn-only 可视化。升 error 前需实现作用域分析（只报
        # it 内赋值但无 afterEach 还原的真 footgun）。advisory 让 CI 可见防止新增，不阻断现有。
        run: node scripts/check-env-isolation.mjs
        continue-on-error: true  # advisory：62 条历史 violation 待逐批迁移 stubEnv 后升 error
      - name: Check changelog sync (治理：fix(security)/feat/BREAKING commit 漏登 [Unreleased] 检测，advisory)
        # 检测最近版本日期后的 feat/fix(security|reliability|correctness)/BREAKING commit
        # 是否登记在 CHANGELOG.md [Unreleased] 段。CHANGELOG 全手动无自动化，人肉易漏。
        # advisory(warn-only)让 CI 可见漏登，不阻断。STRICT=1 升 error。
        run: npm run check:changelog-sync
        continue-on-error: true  # advisory：首版非阻断，团队习惯后考虑 STRICT
      # Linux 测试 gate:排除 game-bridge.test.ts。该文件 vi.mock('net')+vi.hoisted+queueMicrotask
      # 在 Linux 稳定失效(诊断步实测 issue #15:单文件 113/120/138 行同败 → 非全量隔离,vitest 配置无救)。
      # 平台敏感(Linux 败/Windows 全过),版本无关(4.1.7/4.1.9 双版本 Windows 全过)。
      # 非生产/测试逻辑 bug。T-2 守护 + game-bridge.ts 覆盖率退本地(Windows game-bridge.test.ts 全过)。
      # 详见 https://github.com/wgt19861219/godot-mcp-enhanced/issues/15
      - name: Install Godot 4.6.3 (M3c, job-isolated)
        # P0-4（2026-08-10）：Godot 安装前置到 vitest 之前，让主 vitest 拿到 GODOT_PATH。
        # 此前 vitest（:85）跑在安装前，GODOT_PATH 未设 → data-import-integration 等
        # skipIf(!hasGodot) 测试被静默跳过 → 覆盖率是 mock 覆盖率（codecov 失真）。
        # 前置后这些测试在 check job 也真跑，覆盖率从 mock 转真。代价 +30-60s 下载。
        run: |
          set -e
          curl -L --fail -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          mkdir -p /tmp/godot-bin
          unzip -o /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.6.3-stable_linux.x86_64
          echo "GODOT_PATH=/tmp/godot-bin/Godot_v4.6.3-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Run vitest (Godot available for skipIf tests)
        # P0-4：补 env GODOT_PATH，让 describe.skipIf(!hasGodot) 测试真跑（非静默 skip）
        # 2026-08-15: CI 2 核 runner 并发 spawn Godot 资源耗尽致 GD 类测试超时/输出丢失(flaky 58%)
        # 历史失败——限 maxWorkers=2 串行化大部分 GD spawn(本地全量绿,CI 全绿为合并门禁)
        # 2026-08-16 (PR#25): 再排除 data-import-integration——其 beforeAll 自预热
        # real-project(executeGdscript 触发 --import 生成 .godot/global_script_class_cache.cfg),
        # 与 e2e-full L1/L2 段(同用 real-project 的 Godot 进程)在全量并发调度下竞态:
        # 预热"成功"返回但 cache 未生成 → suite 稳定红(master 靠文件调度顺序侥幸不撞,
        # v0.30 新增测试文件改变调度后暴露)。真 Godot 集成覆盖不降:matrix job
        # (4.6.3+4.7.2)的 7 文件隔离集稳定跑它且绿。
        run: npx vitest run --maxWorkers=2 --exclude test/game-bridge.test.ts --exclude test/tools/data-import-integration.test.ts --coverage --reporter=default --reporter=json --outputFile=coverage/test-report.json
        env:
          GODOT_PATH: ${{ env.GODOT_PATH }}
      - name: Check gdscript（产出 report；blocking 经下游 score:gate，本步 exit 0 即使 errors>0）
        run: npm run check:gdscript
        env:
          GODOT_PATH: ${{ env.GODOT_PATH }}
      - name: npm audit (M3a, non-blocking)
        run: npm run audit:json --silent > coverage/audit.json 2>/dev/null || true
        continue-on-error: true
      - name: Generate score.json (M1, non-blocking)
        run: |
          npm run build
          npm run score
        continue-on-error: true
      - name: Score gate (M3b)
        run: npm run score:gate
      - name: Score pr-comment (M3b-PR)
        if: always()
        continue-on-error: true
        run: npm run score:pr-comment
      - name: Score html (M3b-HTML)
        if: always()
        continue-on-error: true
        run: npm run score:html
      # Sticky PR comment 移除:marocchino/sticky-pull-comment 仓库已删除(GitHub),
      # 致 check job Set up 解析 action 失败(即使 if:false)。scoring pr-comment 仍由
      # score:pr-comment npm 生成 + 上传 artifact,仅失去 PR 自动贴评论(可后续换 action)。
      - name: Upload score.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: score-json
          path: coverage/score.json
          if-no-files-found: warn
      - name: Upload score-report.html
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: score-report-html
          path: coverage/score-report.html
          if-no-files-found: warn
      - uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  # Windows CI 撤回(issue #15 评估):windows-runner 上 Node libuv fs-event.c:72 abort
  # (fs.watch 监视 filename 路径断言失败)是底层硬 bug,3 个「减 fs.watch」杠杆全败:
  # PR14 C(去 coverage)/Phase1#1(--poolOptions CLI 无效)/Phase1#2(--maxWorkers=1,Worker
  # exited unexpectedly)。本地 Windows 零复现(fs.watch 行为不同)。Windows 守护退本地
  # (开发者跑 vitest run 验证 game-bridge.test.ts + process-state win32 分支)。详见 issue #15。

  # Godot 多版本矩阵（4.6.3 + 4.7.2）：编译门禁（gdscript-only gate 真 blocking）+ E2E。
  # check job 的 gdscript blocking 经 score:gate（6 维）；本 job 不跑 score（无 lcov/audit），
  # 用独立 gdscript-only gate 消费 coverage/gdscript-report.json。
  godot-matrix:
    name: Godot ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "4.6.3"
            url: "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip"
            bin: "Godot_v4.6.3-stable_linux.x86_64"
          - name: "4.7.2"
            url: "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
            bin: "Godot_v4.7.2-stable_linux.x86_64"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Install Godot ${{ matrix.name }}
        run: |
          set -e
          curl -L --fail -o /tmp/godot.zip ${{ matrix.url }}
          mkdir -p /tmp/godot-bin
          unzip -o /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/${{ matrix.bin }}
          echo "GODOT_PATH=/tmp/godot-bin/${{ matrix.bin }}" >> "$GITHUB_ENV"
      - name: Check gdscript（产出 report；正常路径 exit 0 即使 errors>0）
        run: npm run check:gdscript
        env:
          GODOT_PATH: ${{ env.GODOT_PATH }}
      - name: Gate gdscript（errors/incomplete → fail；真 blocking 在此，非 check:gdscript 退出码）
        run: node -e "const r=require('./coverage/gdscript-report.json'); if(r.incomplete||r.errors>0){console.error('gdscript gate FAIL',JSON.stringify(r));process.exit(1)}"
      - name: E2E + GDScript unit (real Godot ${{ matrix.name }})
        # C5 (2026-08-14): 去 process.env.CI 硬短路后 L2 bridge/recording 套件真跑 —— 其中
        # run_project 起 Godot 游戏进程(GUI 渲染),ubuntu runner 无显示,包 xvfb-run
        # (对齐 editor-e2e.yml 范式;headless spawn 的文件在 xvfb 下行为不变)。
        # 文件级串行(2026-08-21): full-tool(L2 recording)/get-node-layout/resilience 共用
        # real-project —— 并行时 get-node-layout beforeAll rmSync(.godot) 会删掉旁侧实例
        # 已写好的 secret,且 PR#57 端口随机化后 TS 侧(CI 上 registry 未命中)按 secret 文件
        # 扫描发现端口,双实例并行 secret/端口串门致 run_project wait_for_bridge 失败
        # (master 32485788334 两连红同用例,同代码 PR run 绿 = 时序竞态非代码回归;
        # PR#57 前 GD 确定性绑 9081 掩盖此竞态)。
        # P8 审查 N-1 (2026-09-12): 补 p3-e2e/p8-e2e 进白名单——L2 列表是白名单制,
        # 新增 e2e 文件默认不进 CI(check job 的 vitest 收集但无 GODOT_MCP_E2E_L2 恒 skip),
        # p3/p8 连续两批漏加致热加载运行中改/删/回滚行为无 CI 护栏。
        # 架构检查 D1 (2026-09-12): 再补 6 个更早漏加的 gate 文件(p7-e2e/qa-suite/qa-assert-batch/
        # bridge-feedback-pits/bridge-input-seq/gd-symmetry——其 L2 用例在 CI 从未跑过),
        # 并转对账制:check job 的 check-e2e-l2-coverage 步骤机械校验"引用 GODOT_MCP_E2E_L2
        # gate 的文件 ⊆ 本列表",新 L2 文件漏加即 CI 红,白名单漏加事故(p3/p8/p7 三连)不再可能。
        run: xvfb-run -a -s '-screen 0 1920x1080x24' npx vitest run --no-file-parallelism test/e2e-full-tool-verification.test.ts test/e2e-p1-p5.test.ts test/tools/data-import-integration.test.ts test/e2e-resilience-headless.test.ts test/gdscript-unit.test.ts test/gdscript-bridge-error-capture.test.ts test/e2e-bridge-get-node-layout.test.ts test/p3-e2e.test.ts test/p8-e2e.test.ts test/p7-e2e.test.ts test/e2e-qa-suite.test.ts test/e2e-qa-assert-batch.test.ts test/e2e-bridge-feedback-pits.test.ts test/e2e-bridge-input-sequence.test.ts test/e2e-gd-symmetry.test.ts test/e2e-bridge-mouse-gui.test.ts --reporter=json --outputFile=coverage/e2e-report-${{ matrix.name }}.json
        env:
          GODOT_PATH: ${{ env.GODOT_PATH }}
          # 2026-08-06 审查测试-P2-4：L2 bridge 字段级守护。
          # C5 (2026-08-11 P1-2 收尾): 原 e2e-full 内三个 L2 describe skipIf 含 process.env.CI
          # 永真短路,此 env 从未真启用它们(假接线)——skipIf 已去 CI gate,本 env 现在真生效。
          GODOT_MCP_E2E_L2: '1'
          # P1-2 (2026-08-11): MULTI_INSTANCE 接入 matrix(L3 godot_list_instances/select/
          # dynamic/advanced;headless 无 editor 实例注册,返空列表/error 文本,expectHasText 仍过)
          GODOT_MCP_MULTI_INSTANCE: '1'
      - name: Gate e2e 非空执行（all-skip = fail）
        # 测试G-2 (2026-08-20 审查): vitest 全 skip 返 exit 0（实测 total=2/pending=2 仍 0），
        # fixture/GODOT_PATH 供给链断掉时 e2e 假绿（C5 家族）。对齐上方 gdscript gate 范式。
        run: node -e "const r=require('./coverage/e2e-report-${{ matrix.name }}.json'); const t=r.numTotalTests??0, p=r.numPendingTests??0; if(!(t>0&&p<t)){console.error('e2e non-empty gate FAIL, numTotalTests='+t+' numPendingTests='+p+' (all skipped or empty)'); process.exit(1)} console.log('e2e non-empty gate PASS, '+t+' tests, '+p+' pending')"
      - name: Upload e2e-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.name }}
          path: coverage/e2e-report-${{ matrix.name }}.json
          if-no-files-found: warn

  # macOS 最小验证(2026-09-20 可移植性 P3):三平台验证面补 macOS——lint + 类型检查
  # + 构建 + 非 Godot 单测子集(test/cli/ 全部为 mock/临时目录实现,不依赖 Godot 二进制)。
  # 不含 Godot 依赖测试(GD 下载链与 xvfb 方案不适用于本 job 的最小定位;L2/真机/覆盖率
  # 面留缺口声明,由 ubuntu check/godot-matrix 覆盖)。Windows 维持退本地(issue #15
  # libuv fs-event 底层 bug,见 check job 尾注)——平台敏感回归有 Linux+macOS 双护栏。
  macos-smoke:
    name: macOS smoke
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Typecheck test helpers
        run: npm run typecheck:helpers
      - run: npm run build
      - name: 非 Godot 单测子集(CLI/客户端适配器/卸载链)
        run: npx vitest run test/cli/

