# .github/workflows/editor-e2e.yml — GUI editor E2E（2026-08-06 审查测试-P1-1 + P1 完成段标记的 TODO）
#
# 背景：e2e-resilience-editor.test.ts（SIGKILL 崩溃注入重连 + N=5 并发串行）+ test_undo_manager.gd
# （5 个 undo 行为测试）都需 GUI Godot editor（EditorInterface / EditorUndoRedoManager），
# Ubuntu CI headless 跑不了。主 ci.yml 的 godot-matrix job 只跑 headless e2e。
#
# 本 workflow 用 Xvfb（X Virtual Framebuffer）在 Ubuntu 跑无显示器的 GUI editor：
#   1. 装 Xvfb + Godot Linux editor（带 X11 支持的 stable 版）
#   2. xvfb-run 包裹 vitest，让 Godot editor 以为有显示器
#   3. 设 E2E_EDITOR=1 启用 e2e-resilience-editor.test.ts
#   4. testing 工具的 test_run 经 editor 路由跑 test_undo_manager.gd
#
# 触发：weekly（每周日 00:00 UTC）+ manual（workflow_dispatch）。
# 不阻塞 PR/push——editor 韧性回归通过此 workflow 报警，不在主 CI 拦截。
#
# 失败处理：workflow 失败时 GitHub Actions 自动邮件通知 last committer。
# 详见：
#   - D:\workspace\Obsidian\GodotMCP\开发日志\2026-08-06 审查测试覆盖缺口与可信度.md（finding 测试-P1-1）
#   - D:\workspace\Obsidian\GodotMCP\开发日志\2026-08-06 审查 addons GDScript（v0.24.1 后）.md（P1-5 undo_manager）
name: Editor E2E (weekly + manual)

on:
  schedule:
    # C5 (2026-08-11 P1-1): weekly→daily,editor 韧性回归窗口 7 天→1 天
    # (matrix 降级需 GUI+Xvfb 大改,先以每日 cron 缩窗;失败仍只建 issue 不阻断已合并 PR)
    - cron: '0 0 * * *'  # 每日 00:00 UTC
  workflow_dispatch: {}  # 手动触发

# P2-G: issue 创建需 issues: write 权限（默认 GITHUB_TOKEN 只读）
# M-9(2026-10-22 审查): 显式声明 permissions 后未列出的权限全部收为 none——
# 缺 contents: read 时私有 fork/受限环境 checkout 失败,依赖缓存/artifact 同样受限。
permissions:
  contents: read
  issues: write

jobs:
  editor-e2e:
    name: GUI editor E2E on Ubuntu + Xvfb
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run build

      # 装 Xvfb（X Virtual Framebuffer）+ xdotool（一些 Godot editor 操作需窗口管理）
      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool

      # 装 Godot 4.7.2 stable Linux editor（带 X11 支持，非 headless 版）
      - name: Install Godot 4.7.2 editor (Linux X11)
        run: |
          set -e
          curl -L --fail -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          mkdir -p /tmp/godot-bin
          unzip -o /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
          echo "GODOT_PATH=/tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"

      # I-1 (2026-08-14 第三方审查): real-project/addons/ 是 gitignored 本地副本,
      # CI 全新 checkout 缺失 → hasProject false → 全部 editor-e2e 静默 skip(工作流
      # 假绿数月)。每次运行前从 addons/ 主副本拷入,CI 永远测当前源(零滞后)。
      - name: Sync addon into real-project fixture (gitignored, missing on fresh checkout)
        run: |
          mkdir -p test/fixtures/real-project/addons
          cp -r addons/godot_mcp_server test/fixtures/real-project/addons/

      # 跑 e2e-resilience-editor（SIGKILL 崩溃注入 + N=5 并发串行 undo 安全）
      # xvfb-run -a 自动分配空闲 display 号，-s 给 X server 参数（24-bit color + 1920x1080 分辨率）
      - name: E2E resilience editor (SIGKILL reconnect + concurrency)
        run: xvfb-run -a -s '-screen 0 1920x1080x24' npx vitest run test/e2e-resilience-editor.test.ts --reporter=json --outputFile=coverage/editor-e2e-resilience.json
        env:
          GODOT_PATH: ${{ env.GODOT_PATH }}
          E2E_EDITOR: '1'  # 启用 e2e-resilience-editor 的 describe.skipIf(!canRun)

      # 跑 test_undo_manager.gd 经 testing 工具 test_run（editor 路由）
      # 2026-08-07 审查 NIT-2 修复：原 inline node 脚本用不存在的 GodotServer.makeCtx() / 错误构造签名，
      # 改为标准 vitest 文件（test/e2e-testing-undo-manager.test.ts）复用 e2e-resilience-editor 的
      # spawn + EditorToolExecutor 模式，API 正确。
      - name: E2E testing tool (undo_manager GDScript suite via editor)
        run: xvfb-run -a -s '-screen 0 1920x1080x24' npx vitest run test/e2e-testing-undo-manager.test.ts --reporter=json --outputFile=coverage/editor-e2e-testing.json
        env:
          GODOT_PATH: ${{ env.GODOT_PATH }}
          E2E_EDITOR: '1'

      # 跑 asset 工具真 editor 端到端（create/path/batch/undo/save + 11 shape）
      # 2026-08-10 项目待办 :177：e2e-asset-tools.test.ts 已从「手工启动 editor 模式」
      # 重写为自 spawn harness（仿 e2e-testing-undo-manager），weekly 可直接 xvfb-run 跑。
      - name: E2E asset tools (create/path/batch/undo/save + 11 shapes via editor)
        run: xvfb-run -a -s '-screen 0 1920x1080x24' npx vitest run test/e2e-asset-tools.test.ts --reporter=json --outputFile=coverage/editor-e2e-asset.json
        env:
          GODOT_PATH: ${{ env.GODOT_PATH }}
          E2E_EDITOR: '1'

      # 批 H / H-1 (2026-08-15)：debug 子系统 10 action 的 editor 真进程 e2e。
      # 此前 debug Phase 2/3 只有源码字符串断言（cmp-14-debug-phase2 /
      # gd-open-findings-contract），A2 _debug_in_flight 互斥守卫零运行时验证。
      # 覆盖：断点链路(set→play→stack_trace→inspect_frame→evaluate→continue) +
      # A2 并发互斥(-32000 in-flight 拒) + Phase 1 list/clear。
      # Xvfb 可跑：断点目标场景无窗口依赖（Node + _process 循环脚本），游戏进程
      # 由 editor spawn 挂在 Xvfb display 上。
      - name: E2E debug tools (breakpoint chain + A2 mutex + Phase 1 manage)
        run: xvfb-run -a -s '-screen 0 1920x1080x24' npx vitest run test/e2e-debug-tools.test.ts --reporter=json --outputFile=coverage/editor-e2e-debug.json
        env:
          GODOT_PATH: ${{ env.GODOT_PATH }}
          E2E_EDITOR: '1'

      # P1-1 (2026-08-11 审查): e2e-phase1-discovery 加进 weekly(消除死代码,原任何 CI 都不执行)
      - name: E2E phase1 discovery (三级 discovery + dynamic 工具集成)
        run: xvfb-run -a -s '-screen 0 1920x1080x24' npx vitest run test/e2e-phase1-discovery.test.ts --reporter=json --outputFile=coverage/editor-e2e-phase1.json
        env:
          GODOT_PATH: ${{ env.GODOT_PATH }}
          E2E_EDITOR: '1'

      # 测试G-2 (2026-08-20 审查): e2e 非空执行守门。vitest 全 skip 返 exit 0（实测
      # total=2/pending=2 仍 exit 0），fixture 供给链断掉时本 workflow 假绿数月无人察
      # （C5 家族「接线修了、执行规模守门缺失」）。断言每份 JSON 报告 numTotalTests>0
      # 且 numPendingTests<numTotalTests（至少 1 个真实执行），否则本 job 红。
      - name: Non-empty gate (all-skip = red)
        run: |
          node -e '
            const fs = require("fs");
            const files = fs.readdirSync("coverage")
              .filter(f => f.startsWith("editor-e2e-") && f.endsWith(".json"));
            if (files.length === 0) {
              console.error("FAIL: no editor-e2e json reports found (vitest steps never ran?)");
              process.exit(1);
            }
            let bad = 0;
            for (const f of files) {
              const r = JSON.parse(fs.readFileSync(`coverage/${f}`, "utf8"));
              const total = r.numTotalTests ?? 0;
              const pending = r.numPendingTests ?? 0;
              if (!(total > 0 && pending < total)) {
                console.error(`FAIL ${f}: numTotalTests=${total} numPendingTests=${pending} (all skipped or empty)`);
                bad++;
              }
            }
            if (bad > 0) process.exit(1);
            console.log(`all ${files.length} editor-e2e reports non-empty`);
          '

      - name: Upload editor-e2e reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-e2e-report
          path: coverage/editor-e2e-*.json
          if-no-files-found: warn

      # P2-G: weekly 核心韧性测试（SIGKILL 重连 + 并发 undo）失败时自动创建 issue，
      # 防 weekly 失败仅 GitHub 默认邮件被忽略。去重：查同标题 open issue，有则 comment 不新建。
      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = '[editor-e2e] Weekly GUI editor E2E failed';
            // 查是否已有同标题 open issue（去重，防每周堆积）
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'editor-e2e-failure',
              per_page: 1,
            });
            const body = [
              '## Editor E2E Weekly 失败',
              '',
              `**触发时间**: ${context.payload.head_commit?.timestamp || 'unknown'}`,
              `**Run**: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '核心韧性测试（SIGKILL 崩溃注入重连 + N=5 并发 undo 安全）失败。',
              '下载 artifact `editor-e2e-report` 查看 JSON 报告详情。',
              '',
              '> 此 issue 由 `.github/workflows/editor-e2e.yml` 的 `Create issue on failure` 步骤自动创建。',
            ].join('\n');
            if (issues.length > 0) {
              // 已有 open issue → comment 追加本次失败（不新建）
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
              core.info(`Commented on existing issue #${issues[0].number}`);
            } else {
              // 无 open issue → 新建
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['editor-e2e-failure', 'bug'],
              });
              core.info('Created new issue');
            }
